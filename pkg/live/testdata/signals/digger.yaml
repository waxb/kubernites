apiVersion: v1
kind: Pod
metadata:
  name: digger
  namespace: signals
spec:
  terminationGracePeriodSeconds: 1
  restartPolicy: Never
  containers:
  - name: worker
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    command: ["sh", "-c", "dd if=/dev/zero of=/tmp/fill bs=1M count=48; sleep 3600"]
    resources:
      limits:
        ephemeral-storage: 10Mi
