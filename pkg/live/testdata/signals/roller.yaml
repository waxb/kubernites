apiVersion: apps/v1
kind: Deployment
metadata:
  name: roller
  namespace: signals
spec:
  replicas: 2
  progressDeadlineSeconds: 20
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: roller
  template:
    metadata:
      labels:
        app: roller
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: worker
        image: busybox:1.37
        imagePullPolicy: IfNotPresent
        command: ["sleep", "3600"]
        resources:
          requests:
            memory: 8Mi
