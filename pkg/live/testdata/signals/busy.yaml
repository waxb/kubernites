apiVersion: apps/v1
kind: Deployment
metadata:
  name: busy
  namespace: signals
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busy
  template:
    metadata:
      labels:
        app: busy
    spec:
      terminationGracePeriodSeconds: 1
      containers:
      - name: worker
        image: busybox:1.37
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "while true; do :; done"]
        resources:
          requests:
            cpu: 10m
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: busy
  namespace: signals
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: busy
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
