apiVersion: v1
kind: Service
metadata:
  name: basket
  namespace: listed
spec:
  selector:
    app: basket
  ports:
  - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: basket
  namespace: listed
spec:
  ingressClassName: lantern
  rules:
  - host: basket.listed.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: basket
            port:
              number: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: front
  namespace: listed
spec:
  gatewayClassName: none-installed
  listeners:
  - name: http
    port: 80
    protocol: HTTP
