TestTheIdentityKeyFollowsTheCertificateAuthorityAndEveryCredentialSource TestAChoiceRememberedUnderAnotherIdentityIsDroppedAndAskedAgain TestTheDirectoryHoldingTheLedgerAndTheChoicesIsPrivate TestTheLedgerKeepsNoSecretValueTypedInAnyQuotingForm TestASecretWritesLedgerLineIsBuiltFromItsWords TestASecretCommandIsSplitIntoWordsAndNeverMatchedAsRawText TestAConfirmedSendLeavesNoTicketWhateverItsOutcome TestATicketHoldsOnlyForTheContentTypeItWasIssuedFor TestTheForwardDialerIsKubectlsOwnAndBuildsNothingByHandButItsClient TestEveryDialOfAForwardPassesTheConfigsWrappedTransport TestThePinnedStoneSendsJSONBodies TestANodeDebugPodAndADebugCopyAskTheWorkloadsWarningFirst TestEveryDebugAndAnAttachingRunAskTheWorkloadsWarningBeforeAnyPodIsCreatedAtEveryWriteLevel TestAQuotedWebAddressIsNeverFetched TestAQuotedDashNeverReadsTheProcessStdin TestNoLocalFileFlagWaitsOnAPipe TestEveryLocalFileFlagRefusesAPipeADeviceTheWebAndTheKubeconfig TestTheStoneChecksEveryFlagKubectlReadsALocalFileThrough TestTheStonePrintsNoCredentialTheConnectedKubeconfigHolds TestConfigViewRedactsAProxysCredentialsAndKeepsItsAddress TestAClientSideRunPrintsNoSecretValueInAnySpelling TestStopEndsCommandsThatWait TestAContainerThatReadsNoInputCannotGrowTheTerminalsQueue TestCtrlPCtrlQLeavesWhileTheContainerReadsNoInput TestTheLeaveChordIsSeenThroughTerminalRepliesAndNeverReachesTheContainer TestKeysWaitingForAContainerAreCapped TestAKeyIsNeverHeldBackExceptCtrlPWaitingForItsSecondKey TestATerminalThatCannotDrawEndsTheSessionAndTheStoneSaysSo TestStopClosesAForwardWhileThePodReadsNothing TestStopAndCloseShutAForwardsPortAtOnceWhileThePodReadsNothing TestCpNeverWritesDotKubeSpelledInAnotherCase TestCpChecksADirectorysIdentityAfterMakingIt TestAKeptFileNameNeverForgesAStoneLineOrTheAsk TestAnUploadNeverCarriesTheConnectedKubeconfigsCredentials TestAnUploadNamesWhatItSkippedAndNeverSendsTheKubeconfigWhenTyped TestAReplacedLocalFileIsMadeAfreshWithTheModeOfANewFile TestADownloadAsksAgainPastEachBoundAndShowsItsProg