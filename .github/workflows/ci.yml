          go test -count=1 -v -run "^($(echo "$live" | tr ' ' '|'))\$" ./pkg/live/... | tee gate.log
          xvfb-run -a go test -count=1 -v -run "^($(echo "$client" | tr ' ' '|'))\$" ./pkg/client/termview/ ./pkg/client/hud/ ./pkg/client/app/ | tee -a gate.log
          missing=0
          for t in $live $client; do
            if ! grep -q -- "^--- PASS: $t " gate.log; then
              echo "::error::$t did not run and pass"
              missing=1
            fi
          done
          exit "$missing"

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: go build ./cmd/kubernites
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -o "kubernites$(go env GOEXE)" ./cmd/kubernites
          ls -l "kubernites$(go env GOEXE)"
      - name: the macOS build starts
        if: runner.os == 'macOS'
        shell: bash
        run: ./kubernites --version

  dco:
    name: dco
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          unsigned=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$c" | tr '[:upper:]' '[:lower:]')
            signers=$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly,separator=%x0A)' "$c" | tr '[:upper:]' '[:lower:]')
            case "$signers" in
              *"<$email>"*) echo "signed off: $(git log -1 --format='%h %s' "$c")" ;;
              *)
                echo "::error::$(git log -1 --format='%h %s' "$c") has no Signed-off-by line for its author <$email> (git commit -s)"
                unsigned=1
                ;;
            esac
          done
          exit "$unsigned"
